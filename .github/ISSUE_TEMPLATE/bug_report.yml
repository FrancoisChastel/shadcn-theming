name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please include enough detail to reproduce.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what happened instead?
      placeholder: |
        Command: npx shadcn-theming apply brand.json
        Expected: ...
        Actual: ...
    validations:
      required: true
  - type: textarea
    id: brand
    attributes:
      label: brand.json (or source)
      description: The brand.json, logo, URL, or tokens file that triggers the issue. Redact anything sensitive.
      render: json
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `npx shadcn-theming --version` and your Node version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output / logs
      render: shell
